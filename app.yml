install:
  commands:
    - ["npm", "ci", "--include=dev"]

build:
  commands:
    - ["npm", "run", "build"]
    - ["cp", "-r", ".next/static", ".next/standalone/.next/static"]
    - ["cp", "-r", "public", ".next/standalone/public"]
    - ["rm", "-rf", "node_modules"]

run:
  command: ["node", ".next/standalone/server.js"]

profile:
  label: "dbt Model Auditor"
  description: "Automated dbt model quality checks against Snowflake metadata and GitHub repos."
  icon: "public/icon.svg"
